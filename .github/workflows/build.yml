name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q CoreLens.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleRelease --no-daemon
        working-directory: CoreLens
      - uses: actions/upload-artifact@v4
        with:
          name: CoreLens-apk
          path: CoreLens/app/build/outputs/apk/release/app-release.apk
